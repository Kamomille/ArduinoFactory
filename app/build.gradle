plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'

}

android {
    compileSdkVersion 35
    buildToolsVersion "35.0.0"
    ndkVersion "29.0.14033849" 

    defaultConfig {
        applicationId "com.ArduinoFactory.androidstudio"
        minSdk 35
        targetSdk 35
        versionCode 10
        versionName '10.0'
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            //noinspection ChromeOsAbiSupport
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }


    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        mlModelBinding true
    }
    namespace 'com.ArduinoFactory.androidstudio'
}

dependencies {

    //noinspection GradleCompatible
    api 'com.android.support:appcompat-v7:28.0.0'
    //noinspection GradleCompatible
    api 'com.android.support:design:28.0.0'
    api 'androidx.appcompat:appcompat:1.7.1'
    api 'com.google.android.material:material:1.13.0'
    api 'androidx.constraintlayout:constraintlayout:2.2.1'
    api 'androidx.vectordrawable:vectordrawable:1.2.0'
    api 'androidx.navigation:navigation-fragment:2.9.5'
    api 'androidx.navigation:navigation-ui:2.9.5'
    api 'androidx.lifecycle:lifecycle-livedata-ktx:2.9.4'
    api 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.4'
    api'androidx.preference:preference:1.2.1'
    api 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.android.support:multidex:1.0.3'
    implementation 'com.google.firebase:firebase-messaging:25.0.1'
    implementation 'com.google.firebase:firebase-storage:22.0.1'
    implementation 'com.google.firebase:firebase-firestore:26.0.1'
    //noinspection Aligned16KB
    implementation 'org.tensorflow:tensorflow-lite:2.17.0'
    implementation 'org.tensorflow:tensorflow-lite-support:0.5.0' // facultatif si tu utilises des utilitaires
    implementation 'org.tensorflow:tensorflow-lite-metadata:0.5.0'
    implementation 'com.google.android.gms:play-services-ads:24.6.0'
    implementation 'com.google.android.play:integrity:1.5.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    api 'androidx.recyclerview:recyclerview:1.4.0'
    api 'com.google.firebase:firebase-auth:24.0.1'


}
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}
allprojects {
    repositories {
        // Check that you have the following line (if not, add it):
        google()  // Google's Maven repository

    }
}
